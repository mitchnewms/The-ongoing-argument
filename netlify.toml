[build]
  functions = "netlify/functions"

# The AI function reads its master prompt from this file at runtime, so it must be
# shipped inside the function package. Without this the function crashes on startup.
[functions."ai"]
  included_files = ["netlify/functions/ai-prompt.txt"]

# Prevent browsers from serving stale cached HTML after a deploy.
# index.html must always be re-fetched; only the file itself is affected.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[redirects]]
  from = "https://imaginative-starburst-a1bbd9.netlify.app/*"
  to = "https://theongoingargument.com/:splat"
  status = 301
  force = true

# The build lives at /beta147. Old join links redirect to the new address.
[[redirects]]
  from = "/join/*"
  to = "/beta147/join/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/beta147/join/*"
  to = "/beta147/index.html"
  status = 200

[[redirects]]
  from = "/beta147"
  to = "/beta147/index.html"
  status = 200

[[redirects]]
  from = "/beta147/admin"
  to = "/beta147/admin.html"
  status = 200

[[redirects]]
  from = "/beta147/pricing"
  to = "/beta147/pricing.html"
  status = 200

[[redirects]]
  from = "/beta147/terms"
  to = "/beta147/terms.html"
  status = 200

# Pricing and terms moved under the build address. The old public addresses now show not found, so
# nothing on the home address leads to them or hints at the build.
[[redirects]]
  from = "/pricing"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/terms"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# The site is published from the repository root, so keep server code, the AI master prompt and
# the draft database rules from being downloaded as web files.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/firestore-rules/*"
  to = "/404.html"
  status = 404
  force = true

# Keep the build out of search results.
[[headers]]
  for = "/beta147/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/beta147"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
